# =============================================================================
# devbox: Claude Code + HAPI + Tailscale
#
# 使用前先准备配置：
#   cp .env.example .env   然后编辑 .env（API 端点、API Key、Tailscale auth key 等）
#   首次启动无需手动授权：entrypoint 以 root 引导，自动创建并 chown 数据目录后降权运行
#
# 启动：
#   docker compose up -d --build
#   docker compose logs -f     # 查看 HAPI 的 URL / 二维码 / token
# =============================================================================
services:
  devbox:
    build: .
    image: devbox:latest
    container_name: devbox
    hostname: ${TS_HOSTNAME:-devbox-vps}          # 与 tailnet 中的主机名保持一致
    restart: unless-stopped
    env_file: .env                                # 注入 ANTHROPIC_* / TS_* / HAPI_* 等变量
    environment:
      WORKSPACE_ROOT: /workspace                  # runner 允许浏览/新建会话的目录
    volumes:
      - ./workspace:/workspace                    # 代码工作区（不设权限，见 README）
      - ./data:/home/devbox                       # devbox 用户全部数据：认证/配置/会话/agent 二进制(~/.local)
      - ./tailscale:/var/lib/tailscale            # Tailscale 状态（重启不重新认证）
    # 可选：在 VPS 本机回环上暴露 HAPI Web UI（http://localhost:3006）
    # 注意：仅当你需要在 VPS 本地浏览器直接访问时再打开；远程请走 relay/Tailscale
    # ports:
    #   - "127.0.0.1:3006:3006"
    stdin_open: true
    tty: true
    healthcheck:
      test: ["CMD", "bash", "-c", "(echo > /dev/tcp/127.0.0.1/3006) 2>/dev/null || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
